start on starting framework
stop on stopping framework

export LANG LC_ALL

pre-start script
    source /etc/upstart/functions
    
    SS_DIR="/mnt/us/onlinescreensaver/screensaver"
    KINDLE_SS_DIR="/usr/share/blanket/screensaver"
    
    mkdir -p "$SS_DIR"
    
    if ! grep -q " $KINDLE_SS_DIR " /proc/mounts; then
        f_log I onlinescreensaver-mount "mounting screensavers: $SS_DIR -> $KINDLE_SS_DIR"
        mount --bind "$SS_DIR" "$KINDLE_SS_DIR"
    else
        f_log I onlinescreensaver-mount "screensaver dir already mounted"
    fi
    
    # Also mount /var/local/blanket/screensaver if it exists (some Kindle FW versions)
    ALT_SS_DIR="/var/local/blanket/screensaver"
    if [ -d "$ALT_SS_DIR" ] && ! grep -q " $ALT_SS_DIR " /proc/mounts; then
        f_log I onlinescreensaver-mount "also mounting alt: $SS_DIR -> $ALT_SS_DIR"
        mount --bind "$SS_DIR" "$ALT_SS_DIR"
    fi
    
    return 0
end script

post-stop script
    source /etc/upstart/functions
    for KINDLE_SS_DIR in /usr/share/blanket/screensaver /var/local/blanket/screensaver; do
        if grep -q " $KINDLE_SS_DIR " /proc/mounts; then
            f_log I onlinescreensaver-mount "unmounting $KINDLE_SS_DIR"
            umount -l "$KINDLE_SS_DIR"
        fi
    done
    return 0
end script
